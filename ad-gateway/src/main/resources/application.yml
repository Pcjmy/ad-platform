server:
  port: 9000

spring:
  application:
    name: ad-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: ad-sponsor
          uri: lb://ad-sponsor
          predicates:
            - Path=/rest/ad-sponsor/**
          filters:
            - StripPrefix=1
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
